<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">AI Supervisor</a>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar bg-light p-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a class="nav-link" href="index.html"><i
                            class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="pending.html"><i
                            class="bi bi-hourglass-split me-2"></i>Pending Requests</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="history.html"><i
                            class="bi bi-clock-history me-2"></i>Request History</a></li>
                <li class="nav-item mb-2"><a class="nav-link active" href="kb.html"><i
                            class="bi bi-book me-2"></i>Knowledge Base</a></li>
            </ul>
        </aside>

        <main class="main-content p-4 w-100">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Learned Knowledge Base</h2>
                    <a href="index.html" class="btn btn-secondary btn-sm">← Back</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Question</th>
                                        <th>Answer</th>
                                        <th>Updated At</th>
                                    </tr>
                                </thead>
                                <tbody id="kb-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadKB() {
            const response = await fetch("http://127.0.0.1:8000/kb/all");
            const data = await response.json();

            const table = document.getElementById("kb-table");
            table.innerHTML = "";

            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.question}</td>
                        <td>${item.answer}</td>
                        <td>${item.updated_at ?? "-"}</td>
                    </tr>
                `;
                table.innerHTML += row;
            });
        }

        loadKB();
    </script>

</body>

</html>
