<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pending Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">AI Supervisor</a>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar bg-light p-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a class="nav-link" href="index.html"><i
                            class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-2"><a class="nav-link active" href="pending.html"><i
                            class="bi bi-hourglass-split me-2"></i>Pending Requests</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="history.html"><i
                            class="bi bi-clock-history me-2"></i>Request History</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="kb.html"><i class="bi bi-book me-2"></i>Knowledge
                        Base</a></li>
            </ul>
        </aside>

        <main class="main-content p-4 w-100">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Pending Help Requests</h2>
                    <a href="index.html" class="btn btn-secondary btn-sm">← Back</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Request ID</th>
                                        <th>Caller ID</th>
                                        <th>Question</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="pending-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API base URL - configured via localStorage or defaults
        const API_BASE = (() => {
            const stored = localStorage.getItem('API_BASE_URL');
            if (stored) return stored;
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://127.0.0.1:8000';
            }
            console.warn('API_BASE_URL not configured.');
            return 'http://127.0.0.1:8000';
        })();

        async function loadPending() {
            const table = document.getElementById("pending-table");
            try {
                const response = await fetch(`${API_BASE}/help/requests/pending`);
                const data = await response.json();

                table.innerHTML = "";

                if (data.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-5">
                                <div class="empty-state">
                                    <div class="empty-state-icon"><i class="bi bi-inbox"></i></div>
                                    <div class="empty-state-text">No pending requests</div>
                                    <p class="text-muted mt-2">All requests have been resolved!</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                data.forEach((req, idx) => {
                    const row = `
                        <tr class="fade-in" style="animation-delay: ${idx * 50}ms;">
                            <td><code class="text-primary">${req.request_id.substring(0, 8)}...</code></td>
                            <td><span class="badge bg-info">${req.caller_id}</span></td>
                            <td><strong>${req.question}</strong></td>
                            <td>
                                <a href="resolve.html?request_id=${req.request_id}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-pencil-square me-1"></i> Resolve
                                </a>
                            </td>
                        </tr>
                    `;
                    table.innerHTML += row;
                });
            } catch (e) {
                table.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-5">
                            <div class="alert alert-danger mb-0">
                                <i class="bi bi-exclamation-triangle me-2"></i> Failed to load pending requests
                            </div>
                        </td>
                    </tr>
                `;
                console.error("Error loading pending requests:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPending);
        // Auto-refresh every 3 seconds
        setInterval(loadPending, 3000);
    </script>

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</body>

</html>

</html>
