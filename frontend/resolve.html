<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resolve Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">AI Supervisor</a>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar bg-light p-3">
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a class="nav-link" href="index.html"><i
                            class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="pending.html"><i
                            class="bi bi-hourglass-split me-2"></i>Pending Requests</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="history.html"><i
                            class="bi bi-clock-history me-2"></i>Request History</a></li>
                <li class="nav-item mb-2"><a class="nav-link" href="kb.html"><i class="bi bi-book me-2"></i>Knowledge
                        Base</a></li>
            </ul>
        </aside>

        <main class="main-content p-4 w-100">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Resolve Help Request</h2>
                    <a href="pending.html" class="btn btn-secondary btn-sm">← Back</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="details" class="mb-4"></div>

                        <div class="mb-3">
                            <label class="form-label">Supervisor Answer:</label>
                            <textarea id="answer" class="form-control" rows="4"
                                placeholder="Type your answer…"></textarea>
                        </div>

                        <button class="btn btn-success" onclick="submitAnswer()"><i
                                class="bi bi-check2-circle me-1"></i> Submit</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API base URL - configured via localStorage or defaults
        const API_BASE = (() => {
            const stored = localStorage.getItem('API_BASE_URL');
            if (stored) return stored;
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://127.0.0.1:8000';
            }
            console.warn('API_BASE_URL not configured.');
            return 'http://127.0.0.1:8000';
        })();

        const urlParams = new URLSearchParams(window.location.search);
        const request_id = urlParams.get("request_id");
        const question = urlParams.get("question");
        const caller_id = urlParams.get("caller_id");

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("details").innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <p class="mb-1"><small class="text-muted">Request ID</small></p>
                        <p><code class="text-primary">${request_id.substring(0, 8)}...</code></p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <p class="mb-1"><small class="text-muted">Caller</small></p>
                        <p><span class="badge bg-info">${caller_id}</span></p>
                    </div>
                </div>
                <div class="mb-3">
                    <p class="mb-1"><small class="text-muted">Question</small></p>
                    <p><strong>${question}</strong></p>
                </div>
            `;
        });

        async function submitAnswer() {
            const answer = document.getElementById("answer").value;

            if (!answer.trim()) {
                alert("Please enter an answer");
                return;
            }

            try {
                const submitBtn = event.target;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Submitting...';

                const response = await fetch(
                    `${API_BASE}/help/requests/resolve?request_id=${request_id}&answer=${encodeURIComponent(answer)}`,
                    { method: "POST" }
                );

                if (response.ok) {
                    const successMsg = document.createElement('div');
                    successMsg.className = 'alert alert-success alert-dismissible fade show';
                    successMsg.innerHTML = `
                        <i class="bi bi-check-circle me-2"></i>
                        <strong>Success!</strong> Request resolved and saved to knowledge base.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.querySelector('.card-body').insertBefore(successMsg, document.querySelector('.mb-3'));

                    setTimeout(() => {
                        window.location.href = "pending.html";
                    }, 1500);
                } else {
                    throw new Error('Failed to resolve request');
                }
            } catch (e) {
                alert("Error: " + e.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Submit';
                console.error("Submission error:", e);
            }
        }
    </script>

</body>

</html>
